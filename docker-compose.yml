services:
  postgres:
    image: postgres:16
    container_name: filmflicks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: filmflicks
      POSTGRES_PASSWORD: filmflicks
      POSTGRES_DB: filmflicks
    ports:
      - "5434:5432"
    volumes:
      - filmflicks_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmflicks -d filmflicks"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: filmflicks-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@filmflicks.com
      PGADMIN_DEFAULT_PASSWORD: filmflicks
    ports:
      - "5052:80"
    volumes:
      - filmflicks_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  backend:
    build: ./backend
    image: filmflicks-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: "postgresql+psycopg://filmflicks:filmflicks@postgres:5432/filmflicks"

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      postgres:
        condition: service_healthy
volumes:
  filmflicks_postgres_data:
  filmflicks_pgadmin_data:
