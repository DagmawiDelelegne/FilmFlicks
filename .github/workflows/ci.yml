name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/filmflicks_ci
      DISPLAY_TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/filmflicks_ci
      FRONTEND_URL: http://localhost:3000
      INTERNAL_API_SECRET: ci-test-secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: filmflicks_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d filmflicks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check deployment script syntax
        run: bash -n ../scripts/deploy.sh

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Download repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check lint rules
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Run frontend tests
        run: node --test tests/display-api.test.mjs

      - name: Build frontend
        run: npm run build
  publish:
    name: Publish Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre_deployment_prep'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_PREFIX: ghcr.io/dagmawidelelegne/filmflicks

    steps:
      - name: Download repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre_deployment_prep'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: filmflicks-production
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-2
      EC2_INSTANCE_ID: i-09bf38068012984d0
      AWS_PAGER: ""

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "662875145360"

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_REF" | cut -f1)

          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer commit exists on this branch. Skipping this deployment."
            exit 0
          fi

          remote_script=$(cat <<EOF
          set -eu
          script_file=\$(mktemp /tmp/filmflicks-deploy.XXXXXX.sh)
          trap 'rm -f -- "\$script_file"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/deploy.sh" \
            --output "\$script_file"
          chmod 644 "\$script_file"
          runuser -u ubuntu -- bash "\$script_file" "$GITHUB_SHA"
          EOF
          )

          jq -n --arg script "$remote_script" \
            '{commands: [$script], executionTimeout: ["900"]}' \
            > "$RUNNER_TEMP/ssm-deploy.json"

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$RUNNER_TEMP/ssm-deploy.json" \
            --timeout-seconds 60 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $command_id"

          for attempt in $(seq 1 200); do
            if result=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>"$RUNNER_TEMP/ssm-error.log"); then

              status=$(jq -r '.Status' <<< "$result")
              echo "SSM status: $status"

              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' <<< "$result"
                  exit 0
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  ;;
                *)
                  jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<< "$result"
                  exit 1
                  ;;
              esac
            elif ! grep -q 'InvocationDoesNotExist' "$RUNNER_TEMP/ssm-error.log"; then
              cat "$RUNNER_TEMP/ssm-error.log" >&2
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the deployment result." >&2
          exit 1

      - name: Check public HTTPS endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 10 \
            --output /dev/null \
            "https://filmflicks.dagmawidelelegne.com/api/auth/session"
